<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BüroVersum RPG - Embed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'VT323', monospace;
        }
        
        #rpg-embed-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #0a0a1a, #12122a);
        }
        
        #rpg-embed-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            max-width: 100%;
            max-height: 100%;
        }
        
        /* Für iframe-Einbindung optimiert */
        .embed-ready #rpg-overlay {
            position: absolute !important;
        }
    </style>
</head>
<body>
    <div id="rpg-embed-wrapper">
        <!-- Das eigentliche Spiel wird hier eingebunden -->
        <iframe 
            src="index.html" 
            width="100%" 
            height="100%" 
            frameborder="0"
            allowfullscreen
            title="BüroVersum RPG">
        </iframe>
    </div>
    
    <script>
        // Embed-Optimierungen
        document.documentElement.classList.add('embed-ready');
        
        // Verhindere Scrollen im Parent
        window.addEventListener('load', () => {
            if (window.parent !== window) {
                document.body.style.overflow = 'hidden';
            }
        });
    </script>
</body>
</html>
