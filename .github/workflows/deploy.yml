name: Deploy BüroVersum to GitHub Pages

on:
  push:
    branches: [ main, arena/* ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (public/ erzeugen)
        run: python tools/build.py

      - name: Tests (Regression + JS-Syntaxcheck)
        run: python tools/test_build.py

      - name: Setup Node (für Laufzeit-Smoke-Test)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Runtime-Smoke-Test (jsdom)
        run: |
          npm install --prefix "$RUNNER_TEMP/bv-smoke" jsdom@26 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/bv-smoke/node_modules" node tools/smoke_test.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # Eigene Environment statt `github-pages`: Der Default-Schutz dieser
    # Environment erlaubt nur bestimmte Branches (Settings → Environments).
    # Mit dieser Environment können Arena-/Feature-Branches direkt deployen.
    environment:
      name: pages-live
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
